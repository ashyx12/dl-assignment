[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-world-model"
version = "0.1.0"
description = "Learning environment dynamics with visual neural world models"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "gymnasium",
    "minigrid",
    "pyyaml",
    "pandas",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
